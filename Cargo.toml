[package]
name = "poke"
authors = ["saravenpi"]
version = "0.2.2"
edition = "2021"
description = "Terminal Pokemon encounters, catching, pokedex, and economy."
license = "MIT"
readme = "README.md"
repository = "https://github.com/saravenpi/poke"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

[dependencies]
clap = { version = "4.5.14", features = ["derive"] }
csv = "1.3.0"
dirs = "6.0.0"
image = { version = "0.25.8", default-features = false, features = ["png"] }
rand = "0.9.2"
rust-embed = { version = "8.8.0" }
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
serde_yaml_ng = "0.10.0"
showie = "2.0.1"
